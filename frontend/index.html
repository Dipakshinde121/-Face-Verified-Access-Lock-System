<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS CONTROL</title>
    
    <!-- Google Fonts: Playfair Display, Source Serif 4, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS for Minimalist Monochrome Textures & Rules -->
    <link rel="stylesheet" href="/dashboard/styles.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#FFFFFF',
                        foreground: '#000000',
                        muted: '#F5F5F5',
                        mutedForeground: '#525252',
                        borderLight: '#E5E5E5'
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        body: ['"Source Serif 4"', 'Georgia', 'serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-foreground font-body min-h-screen relative">
    
    <div class="relative z-10 max-w-6xl mx-auto px-6 md:px-8 lg:px-12 py-16 md:py-24">
        
        <!-- Header -->
        <header class="mb-16 border-b-[4px] border-foreground pb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <p class="font-mono text-sm tracking-widest uppercase mb-4 text-mutedForeground">Security Manifesto</p>
                <h1 class="font-display text-6xl md:text-8xl lg:text-9xl font-black tracking-tighter leading-none uppercase">
                    Access<br>Control.
                </h1>
            </div>
            
            <div id="auth-status">
                <button id="login-btn" class="mono-btn font-mono text-sm uppercase tracking-widest font-bold">
                    Authenticate →
                </button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-8 hidden" id="dashboard-content">
            
            <!-- Security Logs -->
            <section class="lg:col-span-8">
                <h2 class="font-display text-3xl font-bold tracking-tight mb-6 border-b border-borderLight pb-4">Audit Log</h2>
                <div class="border border-foreground p-6 md:p-8 bg-background relative texture-grid">
                    <div id="logs-container" class="space-y-4 max-h-[500px] overflow-y-auto">
                        <!-- Logs injected here via JS -->
                        <div class="font-mono text-mutedForeground">Fetching logs...</div>
                    </div>
                </div>
            </section>

            <!-- Device Management -->
            <section class="lg:col-span-4">
                <div class="bg-foreground text-background p-8 inverted-section">
                    <h2 class="font-display text-3xl font-bold tracking-tight mb-6 border-b border-background pb-4">
                        Active Devices
                    </h2>
                    <div class="flex flex-col gap-6" id="devices-container">
                        <!-- Devices injected here -->
                        <div class="border border-background p-4 bg-background/5">
                            <p class="text-sm font-mono text-muted">No active devices.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Login Modal (Hidden by default) -->
        <div id="login-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-background/95 backdrop-blur-sm">
            <div class="w-full max-w-lg bg-background border-[4px] border-foreground p-8 md:p-12 shadow-none relative texture-grid">
                <h2 class="font-display text-4xl font-bold mb-8 tracking-tight">Authorization Required</h2>
                <div class="flex flex-col gap-8">
                    <div class="space-y-2">
                        <label class="font-mono text-xs uppercase tracking-widest font-bold">Username</label>
                        <input type="text" id="admin-user" placeholder="Enter identifier" class="mono-input" value="lab-pc-01">
                    </div>
                    <div class="space-y-2">
                        <label class="font-mono text-xs uppercase tracking-widest font-bold">Passphrase</label>
                        <input type="password" id="admin-pass" placeholder="Enter secret" class="mono-input" value="secure-lab-password-123">
                    </div>
                    <button id="submit-login" class="mono-btn w-full mt-4 font-mono text-sm uppercase tracking-widest font-bold">
                        Verify Identity →
                    </button>
                    <p id="login-error" class="text-foreground font-mono text-sm hidden font-bold underline decoration-2"></p>
                </div>
            </div>
        </div>

    </div>

    <script src="/dashboard/app.js"></script>
</body>
</html>
